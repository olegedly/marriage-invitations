<!--
  Wedding Invitations favicon: two interlocking rings on the app's gold badge,
  the same gold-deep as the invitation's script names and the app's accent
  (client/src/styles.css), so the tab matches both the page and the card. The
  rings are drawn in the invitation's cream sheet rather than white.

  The rings really interlock: the right ring is drawn first, the left one over
  it, then the right ring's lower half is repainted over the left one. That
  leaves the left ring on top at the upper crossing and the right ring on top
  at the lower one. The clip edge at y=16 falls between the two crossings, so
  no seam is visible.

  Geometry is tuned for a 16px tab: rings r=6 on a 32-unit canvas, stroked 2.0,
  which keeps the counters open instead of filling in when the icon is halved.
  Keep this file the single source of truth: the PNG fallbacks beside it are
  rendered from it (README, "Notes for whoever picks this up next").
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Wedding Invitations">
  <title>Wedding Invitations</title>
  <defs>
    <clipPath id="lower-half">
      <rect x="0" y="16" width="32" height="16" />
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="8" fill="#8a6b1f" />

  <g fill="none" stroke="#fdf4d9" stroke-width="2">
    <circle cx="20.6" cy="16" r="6" />
    <circle cx="11.4" cy="16" r="6" />
    <circle cx="20.6" cy="16" r="6" clip-path="url(#lower-half)" />
  </g>
</svg>
